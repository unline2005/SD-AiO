[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-aio"
version = "2.0.0"
description = "Clean single-step SD2.1 all-in-one image restoration framework (haze / rain / denoise)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SD-AiO contributors" }]
dependencies = [
    "accelerate>=1.0",
    "diffusers>=0.38.0,<0.39",
    "lpips>=0.1.4",
    "numpy<3",
    "omegaconf>=2.3",
    "peft>=0.10",
    "Pillow>=9.5",
    "PyYAML>=6",
    "safetensors>=0.4",
    "scikit-image>=0.22",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.65",
    "transformers>=4.35,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["sd_aio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:urllib3 .* doesn't match a supported version"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PERF", "RUF", "PIE"]
