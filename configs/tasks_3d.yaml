# Shared 3-degradation dataset (haze / rain / noise) for all three stages.
#
# Paths are the yhmi server layout; edit them once here and every stage picks
# them up through `data.tasks_file`.

train:
  - name: Train_Dehaze
    deg_type: haze
    lq_path: /root/shared-nvme/data/Train-AIO/OTS_BETA/haze
    gt_path: /root/shared-nvme/data/Train-AIO/OTS_BETA/clear
    prompt: "a high quality clear image without haze, high contrast, sharp details"
    repeat_ratio: 1
    match_prefix_len: 4

  - name: Train_Derain
    deg_type: rain
    lq_path: /root/shared-nvme/data/Test-AIO/RainTrainL/rain
    gt_path: /root/shared-nvme/data/Test-AIO/RainTrainL/norain
    prompt: "a high quality clean image without rain streaks, clear visibility"
    repeat_ratio: 200

  - name: Train_Denoise_15
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 100

  - name: Train_Denoise_25
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 100

  - name: Train_Denoise_50
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 100

  - name: Train_Denoise_WED_15
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    gt_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 2

  - name: Train_Denoise_WED_25
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    gt_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 2

  - name: Train_Denoise_WED_50
    deg_type: noise
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    gt_path: /root/shared-nvme/data/Train-AIO/WaterlooED
    prompt: "a high quality clean image without noise, sharp details"
    repeat_ratio: 2

test:
  - name: Test_Dehaze
    deg_type: haze
    lq_path: /root/shared-nvme/data/Test-AIO/SOTS/outdoor/hazy
    gt_path: /root/shared-nvme/data/Test-AIO/SOTS/outdoor/gt
    prompt: "a high quality clear image without haze, high contrast, sharp details"
    match_prefix_len: 4

  - name: Test_Derain
    deg_type: rain
    lq_path: /root/shared-nvme/data/Test-AIO/Rain100L/rainy
    gt_path: /root/shared-nvme/data/Test-AIO/Rain100L/norain
    prompt: "a high quality clean image without rain streaks, clear visibility"

  - name: Test_Denoise_15
    deg_type: noise
    lq_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    gt_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    prompt: "a high quality clean image without noise, sharp details"

  - name: Test_Denoise_25
    deg_type: noise
    lq_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    gt_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    prompt: "a high quality clean image without noise, sharp details"

  - name: Test_Denoise_50
    deg_type: noise
    lq_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    gt_path: /root/shared-nvme/data/Test-AIO/BSD68/original
    prompt: "a high quality clean image without noise, sharp details"
