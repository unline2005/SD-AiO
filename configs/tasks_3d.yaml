# ====================== 中文注释 ======================
# 文件：tasks_3d.yaml
# 作用：共享的 3 退化任务数据集定义。
# 说明：所有 Stage 都从这里读取 train/test 任务，避免路径散落。
# ============================================================

# Shared 3-degradation dataset (haze / rain / noise) for all three stages.
#
# Paths are the yhmi server layout; edit them once here and every stage picks
# them up through `data.tasks_file`.

train:  # 中文：训练任务列表
  - name: Train_Dehaze  # 中文：名称
    deg_type: haze  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/OTS_BETA/haze  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/OTS_BETA/clear  # 中文：高质量图路径
    prompt: "a high quality clear image without haze, high contrast, sharp details"  # 中文：文本提示词
    repeat_ratio: 1  # 中文：重复采样比例
    match_prefix_len: 4  # 中文：文件名前缀匹配长度

  - name: Train_Derain  # 中文：名称
    deg_type: rain  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Test-AIO/RainTrainL/rain  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Test-AIO/RainTrainL/norain  # 中文：高质量图路径
    prompt: "a high quality clean image without rain streaks, clear visibility"  # 中文：文本提示词
    repeat_ratio: 200  # 中文：重复采样比例

  - name: Train_Denoise_15  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：高质量图路径
    prompt: "a high quality clean image without noise, sharp details"  # 中文：文本提示词
    repeat_ratio: 100  # 中文：重复采样比例

  - name: Train_Denoise_25  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：高质量图路径
    prompt: "a high quality clean image without noise, sharp details"  # 中文：文本提示词
    repeat_ratio: 100  # 中文：重复采样比例

  - name: Train_Denoise_50  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/BSD400  # 中文：高质量图路径
    prompt: "a high quality clean image without noise, sharp details"  # 中文：文本提示词
    repeat_ratio: 100  # 中文：重复采样比例

  - name: Train_Denoise_WED_15  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/WaterlooED  # 中文：高质量图路径
    prompt: "a high quality clean image without noise, sharp details"  # 中文：文本提示词
    repeat_ratio: 2  # 中文：重复采样比例

  - name: Train_Denoise_WED_25  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED  # 中文：低质量图路径
    gt_path: /root/shared-nvme/data/Train-AIO/WaterlooED  # 中文：高质量图路径
    prompt: "a high quality clean image without noise, sharp details"  # 中文：文本提示词
    repeat_ratio: 2  # 中文：重复采样比例

  - name: Train_Denoise_WED_50  # 中文：名称
    deg_type: noise  # 中文：退化类型
    lq_path: /root/shared-nvme/data/Train-AIO/WaterlooED  # 中文：低质量图路径
