stage: classifier
output_dir: ./output/stage1_classifier

model:
  dino_path: /root/shared-nvme/model/dinov2
  num_deg_types: 3
  freeze_encoder: true

data:
  tasks_file: configs/tasks_3d.yaml
  image_size: 256
  num_workers: 8
  augmentation:
    hflip_prob: 0.5

optimizer:
  backbone_lr: 1e-5
  head_lr: 1e-4

loss:
  focal_gamma: 2.0

trainer:
  max_steps: 20000
  train_batch_size: 32
  eval_freq: 500
  checkpointing_steps: 2000
