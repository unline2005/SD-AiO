optimizer:
  lr: 5.0e-05
  weight_decay: 0.0
loss:
  lambda_l2: 2.0
  lambda_lpips: 5.0
  lpips_net: vgg
  timestep:
    strategy: fixed
    value: 100
trainer:
  max_steps: 36000
  train_batch_size: 1
  gradient_accumulation_steps: 4
  eval_freq: 1000
  eval_num_samples: 32
  checkpointing_steps: 500
  eval_split: val
  resume_from: null
  num_images_save_eval: 60
  num_processes: 4
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
  cpu_threads_per_process: 2
  early_stopping:
    enabled: true
    metric: psnr
    mode: max
    min_delta: 0.02
    patience: 8
    min_steps: 6000
  distributed_timeout_seconds: 1800
eval:
  batch_size: 1
  compute_lpips: true
  num_samples_per_task: 32
  noise_seed: 42
keep_last_checkpoints: 3
